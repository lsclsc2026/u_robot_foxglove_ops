# MOS Coordinator 配置参数
# 更新时间: 2026-07-20
# 说明: 使用真实标定的坐标数据

/**:
  ros__parameters:
    # === 机器人ID配置 ===
    robot_id: "R1"  # 机器人标识，可选: "R1" 或 "R2"

    # === 观察点配置（真实标定坐标） ===
    # A点 - 第一个观察点
    observation_point_a:
      x: 1.6916      # A点 X 坐标（米）
      y: 0.2949      # A点 Y 坐标（米）
      z: -0.0747     # A点 Z 坐标（米）
      # 四元数: x=-0.0051, y=-0.001, z=-0.0252, w=0.9997
      yaw: -0.0504   # A点朝向角度（弧度），从四元数计算得出

    # B点 - 第二个观察点
    observation_point_b:
      x: 3.1881      # B点 X 坐标（米）
      y: 0.1841      # B点 Y 坐标（米）
      z: -0.0717     # B点 Z 坐标（米）
      # 四元数: x=-0.0054, y=-0.0002, z=-0.0302, w=0.9995
      yaw: -0.0604   # B点朝向角度（弧度）

    # D点 - 第三个观察点（找空阶段起点）
    observation_point_d:
      x: 5.2611      # D点 X 坐标（米）
      y: 0.0445      # D点 Y 坐标（米）
      z: -0.0603     # D点 Z 坐标（米）
      # 四元数: x=-0.0037, y=-0.001, z=-0.0307, w=0.9995
      yaw: -0.0614   # D点朝向角度（弧度）

    # E点 - 第四个观察点（找空阶段终点）
    observation_point_e:
      x: 7.4745      # E点 X 坐标（米）
      y: -0.1471     # E点 Y 坐标（米）
      z: -0.0443     # E点 Z 坐标（米）
      # 四元数: x=-0.0048, y=0.0004, z=-0.0387, w=0.9992
      yaw: -0.0774   # E点朝向角度（弧度）

    # === 抓车位配置（预留，实际使用时根据观察点动态计算） ===
    # 抓车位通常在观察点前方 0.3-0.5 米处
    cart_approach_offset: 0.4  # 抓车位相对观察点的前进距离（米）

    # === DE巡航点配置（兼容旧版本，实际使用 observation_point_d 和 observation_point_e） ===
    patrol_point_d:
      x: 5.2611      # D点 X 坐标（米）
      y: 0.0445      # D点 Y 坐标（米）
      z: -0.0603     # D点 Z 坐标（米）
      yaw: -0.0614   # D点朝向角度（弧度）

    patrol_point_e:
      x: 7.4745      # E点 X 坐标（米）
      y: -0.1471     # E点 Y 坐标（米）
      z: -0.0443     # E点 Z 坐标（米）
      yaw: -0.0774   # E点朝向角度（弧度）

    # === 固定接近点配置（满载小车检测后的接近位置） ===
    # 接近点 A
    approach_point_a:
      x: 1.6916      # 接近点 A X 坐标（米）- 与观察点 A 相同
      y: 0.2949      # 接近点 A Y 坐标（米）
      z: -0.0747     # 接近点 A Z 坐标（米）
      yaw: -0.0504   # 接近点 A 朝向角度（弧度）

    # 接近点 B
    approach_point_b:
      x: 3.1881      # 接近点 B X 坐标（米）- 与观察点 B 相同
      y: 0.1841      # 接近点 B Y 坐标（米）
      z: -0.0717     # 接近点 B Z 坐标（米）
      yaw: -0.0604   # 接近点 B 朝向角度（弧度）

    # 接近点 D
    approach_point_d:
      x: 5.2611      # 接近点 D X 坐标（米）- 与观察点 D 相同
      y: 0.0445      # 接近点 D Y 坐标（米）
      z: -0.0603     # 接近点 D Z 坐标（米）
      yaw: -0.0614   # 接近点 D 朝向角度（弧度）

    # 接近点 E
    approach_point_e:
      x: 7.4745      # 接近点 E X 坐标（米）- 与观察点 E 相同
      y: -0.1471     # 接近点 E Y 坐标（米）
      z: -0.0443     # 接近点 E Z 坐标（米）
      yaw: -0.0774   # 接近点 E 朝向角度（弧度）

    # === 任务配置 ===
    # 状态发布频率（Hz）
    status_publish_rate: 1.0

    # 到达判断阈值（米）
    arrival_threshold: 0.5

    # 距离计算更新频率（Hz）
    distance_check_rate: 2.0

