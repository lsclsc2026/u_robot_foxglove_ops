# MOS Coordinator 配置参数
# 自动生成 - 从 target_goals.yaml 转换
# 说明: 使用真实标定的坐标数据

/**:
  ros__parameters:
    # === 机器人ID配置 ===
    robot_id: "R1"  # 机器人标识，可选: "R1" 或 "R2"

    # === 观察点配置（真实标定坐标） ===
    # A - 观察点
    observation_point_a:
      x: 0.0304      # a X 坐标（米）
      y: -0.3092     # a Y 坐标（米）
      z: -0.0601     # a Z 坐标（米）
      # 四元数: x=-0.002, y=0.0013, z=-0.0074, w=1.0
      yaw: -0.0148    # a 朝向角度（弧度）

    # B - 观察点
    observation_point_b:
      x: 2.9226      # b X 坐标（米）
      y: -0.3583     # b Y 坐标（米）
      z: -0.0648     # b Z 坐标（米）
      # 四元数: x=-0.0012, y=0.0001, z=0.0077, w=1.0
      yaw: 0.0154     # b 朝向角度（弧度）

    # D - 观察点
    observation_point_d:
      x: 5.8703      # d X 坐标（米）
      y: -0.2987     # d Y 坐标（米）
      z: -0.0622     # d Z 坐标（米）
      # 四元数: x=-0.0006, y=0.0017, z=0.024, w=0.9997
      yaw: 0.048      # d 朝向角度（弧度）

    # E - 观察点
    observation_point_e:
      x: 9.0614      # e X 坐标（米）
      y: -0.1908     # e Y 坐标（米）
      z: -0.0681     # e Z 坐标（米）
      # 四元数: x=-0.0008, y=0.0032, z=0.039, w=0.9992
      yaw: 0.078      # e 朝向角度（弧度）

    # === 巡航点配置（基于观察点，向后兼容） ===
    # 巡航点 A
    patrol_point_a:
      x: 0.0304
      y: -0.3092
      z: -0.0601
      yaw: -0.0148

    # 巡航点 B
    patrol_point_b:
      x: 2.9226
      y: -0.3583
      z: -0.0648
      yaw: 0.0154

    # 巡航点 D
    patrol_point_d:
      x: 5.8703
      y: -0.2987
      z: -0.0622
      yaw: 0.048

    # 巡航点 E
    patrol_point_e:
      x: 9.0614
      y: -0.1908
      z: -0.0681
      yaw: 0.078

    # === 接近点配置（抓取点，从 *a/*aa 等点位生成） ===
    # AA - 接近点（对应 A）
    approach_point_a:
      x: 1.509       # aa X 坐标（米）
      y: -0.4705     # aa Y 坐标（米）
      z: -0.0634     # aa Z 坐标（米）
      yaw: -1.4446    # aa 朝向角度（弧度）

    # BB - 接近点（对应 B）
    approach_point_b:
      x: 4.289       # bb X 坐标（米）
      y: -0.4744     # bb Y 坐标（米）
      z: -0.0621     # bb Z 坐标（米）
      yaw: -1.512     # bb 朝向角度（弧度）

    # DD - 接近点（对应 D）
    approach_point_d:
      x: 7.0742      # dd X 坐标（米）
      y: -0.3695     # dd Y 坐标（米）
      z: -0.0646     # dd Z 坐标（米）
      yaw: -1.593     # dd 朝向角度（弧度）

    # EE - 接近点（对应 E）
    approach_point_e:
      x: 10.8173     # ee X 坐标（米）
      y: -0.2209     # ee Y 坐标（米）
      z: -0.0717     # ee Z 坐标（米）
      yaw: -1.5343    # ee 朝向角度（弧度）

    # === 任务配置 ===
    # 状态发布频率（Hz）
    status_publish_rate: 1.0

    # 到达判断阈值（米）
    arrival_threshold: 0.5

    # 距离计算更新频率（Hz）
    distance_check_rate: 2.0
