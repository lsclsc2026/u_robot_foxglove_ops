# MOS Coordinator 配置参数
# 自动生成 - 从 target_goals.yaml 转换
# 说明: 使用真实标定的坐标数据

/**:
  ros__parameters:
    # === 机器人ID配置 ===
    robot_id: "R1"  # 机器人标识，可选: "R1" 或 "R2"

    # === 观察点配置（真实标定坐标） ===
    # A - 观察点
    observation_point_a:
      x: -0.6451     # a X 坐标（米）
      y: -0.3114     # a Y 坐标（米）
      z: -0.0606     # a Z 坐标（米）
      # 四元数: x=-0.0023, y=0.0003, z=0.0101, w=0.9999
      yaw: 0.0202     # a 朝向角度（弧度）

    # B - 观察点
    observation_point_b:
      x: 3.0663      # b X 坐标（米）
      y: -0.7357     # b Y 坐标（米）
      z: -0.0631     # b Z 坐标（米）
      # 四元数: x=-0.0005, y=0.0006, z=0.0154, w=0.9999
      yaw: 0.0308     # b 朝向角度（弧度）

    # D - 观察点
    observation_point_d:
      x: 6.6471      # d X 坐标（米）
      y: -0.5889     # d Y 坐标（米）
      z: -0.0625     # d Z 坐标（米）
      # 四元数: x=0.0007, y=0.002, z=0.0277, w=0.9996
      yaw: 0.0554     # d 朝向角度（弧度）

    # E - 观察点
    observation_point_e:
      x: 9.0855      # e X 坐标（米）
      y: -0.5202     # e Y 坐标（米）
      z: -0.0686     # e Z 坐标（米）
      # 四元数: x=0.0005, y=0.0035, z=0.0132, w=0.9999
      yaw: 0.0264     # e 朝向角度（弧度）

    # === 巡航点配置（基于观察点，向后兼容） ===
    # 巡航点 A
    patrol_point_a:
      x: -0.6451
      y: -0.3114
      z: -0.0606
      yaw: 0.0202

    # 巡航点 B
    patrol_point_b:
      x: 3.0663
      y: -0.7357
      z: -0.0631
      yaw: 0.0308

    # 巡航点 D
    patrol_point_d:
      x: 6.6471
      y: -0.5889
      z: -0.0625
      yaw: 0.0554

    # 巡航点 E
    patrol_point_e:
      x: 9.0855
      y: -0.5202
      z: -0.0686
      yaw: 0.0264

    # === 接近点配置（抓取点，从 *a/*aa 等点位生成） ===
    # AA - 接近点（对应 A）
    approach_point_a:
      x: 1.5226      # aa X 坐标（米）
      y: -0.6341     # aa Y 坐标（米）
      z: -0.0627     # aa Z 坐标（米）
      yaw: -1.4701    # aa 朝向角度（弧度）

    # BB - 接近点（对应 B）
    approach_point_b:
      x: 4.8616      # bb X 坐标（米）
      y: -0.6086     # bb Y 坐标（米）
      z: -0.0615     # bb Z 坐标（米）
      yaw: -1.4063    # bb 朝向角度（弧度）

    # DD - 接近点（对应 D）
    approach_point_d:
      x: 8.2526      # dd X 坐标（米）
      y: -0.6299     # dd Y 坐标（米）
      z: -0.0654     # dd Z 坐标（米）
      yaw: -1.5503    # dd 朝向角度（弧度）

    # EE - 接近点（对应 E）
    approach_point_e:
      x: 10.3757     # ee X 坐标（米）
      y: -0.5167     # ee Y 坐标（米）
      z: -0.0712     # ee Z 坐标（米）
      yaw: -1.5388    # ee 朝向角度（弧度）

    # === 任务配置 ===
    # 状态发布频率（Hz）
    status_publish_rate: 1.0

    # 到达判断阈值（米）
    arrival_threshold: 0.5

    # 距离计算更新频率（Hz）
    distance_check_rate: 2.0
