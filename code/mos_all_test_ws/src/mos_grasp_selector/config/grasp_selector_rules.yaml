tasks:
  auto_treatment_cart_push:
    enabled: true
    task_name: "auto_treatment_cart_push"
    # 6、7、8 是同等候选类别；每个类别必须单独形成一对把手。
    target_class_ids: [6, 7, 8]
    target_class_id: 6
    target_class_name: "自动治疗车把手"
    required_points: 2
    grasp_mode: "dual_arm_sync"

    trigger:
      mode: "none"

    selection:
      mode: "nearest"
      max_distance_m: 0.0
      min_score: 0.0

    role:
      mode: "split_by_y"
      negative_y: "right_handle"
      positive_y: "left_handle"

    position:
      mode: "detected"

    stability:
      enabled: true
      window: 5
      min_frames: 3
      filter: "median"
      outlier_distance_m: 0.10
      max_std_m: 0.03
      max_range_m: 0.06

    publish_once_when_ready: true

